<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E16" />
<title>Ledger — Trade Math Calculator</title>
<meta name="description" content="Ledger: prop-firm challenge tracker, trade journal, equity curve, and FX converter." />

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />

<!-- Tailwind (JIT, runs client-side, picks up dynamically rendered classes) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Babel Standalone: transpiles LedgerApp.jsx in the browser, no build step -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<!-- Import map: lets bare "react" / "recharts" / "lucide-react" imports resolve to a CDN -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #05070C; overscroll-behavior: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';

  async function loadLedgerApp() {
    const res = await fetch('./LedgerApp.jsx');
    if (!res.ok) throw new Error('Could not fetch LedgerApp.jsx (' + res.status + ')');
    const source = await res.text();

    const { code } = Babel.transform(source, {
      presets: ['react'],
      filename: 'LedgerApp.jsx',
      sourceType: 'module',
    });

    const blob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    try {
      const mod = await import(url);
      return mod.default;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  loadLedgerApp()
    .then((LedgerApp) => {
      createRoot(document.getElementById('root')).render(React.createElement(LedgerApp));
    })
    .catch((err) => {
      console.error(err);
      document.getElementById('root').innerHTML =
        '<div style="color:#EDEFF3;font-family:monospace;padding:24px;white-space:pre-wrap;">' +
        'Failed to load Ledger:\n' + (err && err.message ? err.message : String(err)) +
        '</div>';
    });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
