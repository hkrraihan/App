<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E16" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<title>Ledger — Trade Math Calculator</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />

<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: #05070C; }
  #boot-msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7C8AA0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
  }
</style>

<!-- Tailwind (JIT, in-browser) — LedgerApp.jsx is built entirely on Tailwind utility classes -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: lets LedgerApp.jsx use bare specifiers like "react" straight in the browser -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom"
  }
}
</script>

<!-- Babel standalone: transpiles JSX in the browser, no build step needed -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="boot-msg">Loading Ledger…</div></div>

  <!-- Your app file, transpiled as an ES module (JSX only — import/export left intact) -->
  <script type="text/babel" data-type="module" data-presets="react" src="./LedgerApp.jsx"></script>

  <!-- Entry point: renders LedgerApp into #root -->
  <script type="text/babel" data-type="module" data-presets="react">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import LedgerApp from "./LedgerApp.jsx";

    const rootEl = document.getElementById("root");
    createRoot(rootEl).render(<LedgerApp />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {
          // offline support is optional — app still works without it
        });
      });
    }
  </script>
</body>
</html>
