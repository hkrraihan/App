<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Ledger — Trade with calculation</title>
<meta name="description" content="Ledger — a trading math calculator for prop firm accounts, risk/reward, and trade journaling." />
<meta name="theme-color" content="#0A0E16" />

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon.png" />

<!-- Tailwind (CDN build — no compile step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: lets LedgerApp.jsx's bare "react" / "recharts" / "lucide-react"
     imports resolve straight to CDN builds, all sharing one React copy -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom"
  }
}
</script>

<!-- Babel Standalone: strips JSX in the browser at load time -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #05070C; }
  #boot-fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7C8AA0; font-family: ui-monospace, monospace; font-size: 13px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
  <div id="root">
    <div id="boot-fallback">Loading Ledger…</div>
  </div>

  <!-- Boots LedgerApp.jsx. data-type="module" tells Babel to keep import/export
       syntax intact (only JSX is transformed) so the import map above can resolve it,
       and Babel will also fetch + transform the local LedgerApp.jsx import on the fly. -->
  <script type="text/babel" data-type="module" data-presets="react">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import LedgerApp from "./LedgerApp.jsx";

    const rootEl = document.getElementById("root");
    rootEl.innerHTML = "";
    createRoot(rootEl).render(<LedgerApp />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {
          // offline support is a nice-to-have; ignore registration failures
        });
      });
    }
  </script>
</body>
</html>
