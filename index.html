<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E16" />
<title>Ledger — Trade Math Calculator</title>

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />

<!-- Tailwind (used by LedgerApp.jsx's utility classes) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Babel, so LedgerApp.jsx's JSX can run without a build step -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<!-- Bare-specifier imports used inside LedgerApp.jsx -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>

<style>
  html, body, #root { height: 100%; margin: 0; background: #0A0E16; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
  // 1. Fetch the JSX source
  const res = await fetch("./LedgerApp.jsx");
  const src = await res.text();

  // 2. Transform JSX -> plain JS, but leave import/export statements intact
  //    so the browser (via the import map above) resolves react, recharts, etc.
  const { code } = Babel.transform(src, {
    presets: ["react"],
    filename: "LedgerApp.jsx",
  });

  // 3. Turn the transformed code into a real ES module and import it
  const blob = new Blob([code], { type: "text/javascript" });
  const moduleUrl = URL.createObjectURL(blob);
  const { default: LedgerApp } = await import(moduleUrl);

  // 4. Render it
  const React = await import("react");
  const { createRoot } = await import("react-dom/client");
  createRoot(document.getElementById("root")).render(React.createElement(LedgerApp));

  // 5. Register the offline service worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
