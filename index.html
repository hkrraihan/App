<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E16" />
<title>Ledger — Trade Math Calculator</title>

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />

<!-- Tailwind (the app uses Tailwind utility classes) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts used by the app -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- Import map: lets the browser resolve bare "react", "recharts", "lucide-react" imports -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>

<!-- Babel Standalone: only used to strip JSX from LedgerApp.jsx at load time -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #05070C; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
  // Fetches a local .jsx file, strips the JSX with Babel, and imports it as a
  // real ES module (so its own `import` statements still resolve normally,
  // including through the import map above).
  async function loadJSXModule(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Couldn't load ${url}: ${res.status}`);
    const source = await res.text();
    const { code } = Babel.transform(source, {
      presets: ["react"],
      filename: url,
    });
    const blob = new Blob([code], { type: "text/javascript" });
    const blobUrl = URL.createObjectURL(blob);
    try {
      return await import(blobUrl);
    } finally {
      URL.revokeObjectURL(blobUrl);
    }
  }

  const [{ default: React }, { createRoot }, { default: LedgerApp }] = await Promise.all([
    import("react"),
    import("react-dom/client"),
    loadJSXModule("./LedgerApp.jsx"),
  ]);

  createRoot(document.getElementById("root")).render(React.createElement(LedgerApp));

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
