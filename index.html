<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ledger — Trade Math Calculator</title>
<meta name="description" content="Ledger — risk, position sizing, equity curve, journal and session tools for traders." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A0E16" />
<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />

<!-- Tailwind (the app's classNames rely on this) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Map bare module specifiers used inside LedgerApp.jsx to CDN ES modules -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.13.3?external=react,react-dom"
  }
}
</script>

<!-- In-browser JSX transform (no build step needed) -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; background: #05070C; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<!--
  This script is transformed by Babel (JSX -> React.createElement) and then
  executed as a real ES module, so the "import" statements above resolve
  through the import map. It fetches LedgerApp.jsx as text, runs it through
  the same Babel transform, and dynamically imports the result.
-->
<script type="text/babel" data-presets="react" data-type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";

  async function bootstrap() {
    const res = await fetch("./LedgerApp.jsx", { cache: "no-cache" });
    if (!res.ok) {
      document.getElementById("root").innerHTML =
        '<div style="color:#EDEFF3;font-family:monospace;padding:24px;">Couldn\'t load LedgerApp.jsx — make sure it\'s in the same folder as index.html.</div>';
      return;
    }
    const source = await res.text();
    const { code } = Babel.transform(source, {
      presets: ["react"],
      filename: "LedgerApp.jsx",
    });
    const blob = new Blob([code], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);
    const mod = await import(url);
    URL.revokeObjectURL(url);

    const LedgerApp = mod.default;
    createRoot(document.getElementById("root")).render(<LedgerApp />);
  }

  bootstrap();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // offline caching is a nice-to-have, ignore failures
      });
    });
  }
</script>
</body>
</html>
