<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E16" />
<title>Ledger — Trade Math Calculator</title>

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />

<!-- Tailwind (runtime JIT — no build step needed) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: lets the browser resolve bare "react" / "lucide-react" / "recharts" imports -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>

<!-- Babel standalone: compiles the JSX in LedgerApp.jsx at runtime -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; background: #05070C; }
  * { -webkit-tap-highlight-color: transparent; }
  #boot-msg {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #7C8AA0; font-family: monospace; font-size: 13px;
  }
</style>
</head>
<body>
<div id="root"><div id="boot-msg">Loading Ledger…</div></div>

<script type="module">
  async function boot() {
    const res = await fetch("./LedgerApp.jsx");
    if (!res.ok) throw new Error("Couldn't load LedgerApp.jsx (" + res.status + ")");
    const source = await res.text();

    // Append the mount call in the SAME module so no cross-file import is needed —
    // "LedgerApp" is just the hoisted function name from the fetched source.
    const combined = source + `

import { createRoot } from "react-dom/client";
import React from "react";
createRoot(document.getElementById("root")).render(React.createElement(LedgerApp));
`;

    const { code } = Babel.transform(combined, {
      presets: ["react"],
      sourceType: "module",
      filename: "LedgerApp.jsx",
    });

    const blob = new Blob([code], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);
    await import(url);
  }

  boot().catch((err) => {
    console.error(err);
    document.getElementById("root").innerHTML =
      '<pre style="color:#DB6B63;padding:24px;font-family:monospace;white-space:pre-wrap;font-size:12px;">' +
      "Failed to load the app:\n\n" +
      (err && err.message ? err.message : String(err)) +
      "</pre>";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
