<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E16" />
  <title>Ledger — Trade Math Calculator</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ledger" />

  <!-- Tailwind (JIT, no build step needed) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Resolve bare package imports used inside LedgerApp.jsx to CDN builds -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/": "https://esm.sh/react@18.3.1/",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/": "https://esm.sh/react-dom@18.3.1/",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>

  <!-- In-browser JSX transform -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; background: #05070C; }
    * { box-sizing: border-box; }
    #boot-error { display:none; padding:24px; font-family: monospace; color:#DB6B63; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error"></div>

  <script type="module">
    try {
      // 1. Fetch the raw JSX source
      const res = await fetch('./LedgerApp.jsx', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`Couldn't load LedgerApp.jsx (${res.status})`);
      const source = await res.text();

      // 2. Strip JSX with Babel (imports/exports are left untouched)
      const { code } = window.Babel.transform(source, {
        presets: ['react'],
        filename: 'LedgerApp.jsx',
        sourceType: 'module',
      });

      // 3. Turn the transformed code into a real ES module the browser can import
      const blob = new Blob([code], { type: 'text/javascript' });
      const blobUrl = URL.createObjectURL(blob);
      const { default: LedgerApp } = await import(blobUrl);

      // 4. Mount it
      const React = await import('react');
      const { createRoot } = await import('react-dom/client');
      createRoot(document.getElementById('root')).render(React.createElement(LedgerApp));
    } catch (err) {
      console.error(err);
      const el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = 'Failed to start Ledger:\n\n' + (err && err.message ? err.message : err);
    }

    // Register the PWA service worker (offline support + installability)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
